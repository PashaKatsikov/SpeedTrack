name: cctvspeedtrack
description: "Speed Track - futuristic endless lane racing game."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Gray-flow networking / attribution / push stack ──
  # Versions intentionally diversified from other in-house builds.
  webview_flutter: 4.13.1
  webview_flutter_android: 4.11.0
  shared_preferences: ^2.5.3
  connectivity_plus: 6.1.4
  appsflyer_sdk: ^6.16.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: 11.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  clarity_flutter: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.1

flutter:
  uses-material-design: true

  assets:
    - assets/CCTV_Speed_Track_additional_assets/
    - assets/CCTV_Speed_Track_gameplay_assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/CCTV_Speed_Track_additional_assets/icon3.png"
  adaptive_icon_background: "#0A1220"
  adaptive_icon_foreground: "assets/CCTV_Speed_Track_additional_assets/icon3.png"
  min_sdk_android: 21
